<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmotiLearn | Create Account</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="glass-card auth-card">
        <a class="auth-back" href="/login">← Choose portal</a>
        <h1>EmotiLearn</h1>
        <h2>Create your account</h2>
        <p>Join the emotion-aware learning platform.</p>

        <form id="signupForm">
            <input id="name" type="text" placeholder="Full Name" required>
            <input id="email" type="email" placeholder="Email Address" required>
            <input id="password" type="password" placeholder="Password (8+ characters)" minlength="8" required>
            <select id="role" required>
                <option value="">Select your role</option>
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
            </select>
            <button type="submit">Create Account</button>
        </form>

        <p id="message"></p>
        <p>Already have an account? <a href="/login">Sign in</a></p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const selectedRole = params.get("role");
        if (selectedRole === "student" || selectedRole === "teacher") {
            document.getElementById("role").value = selectedRole;
        }

        document.getElementById("signupForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const message = document.getElementById("message");
            message.textContent = "Creating account...";
            try {
                const response = await fetch("/auth/signup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        name: document.getElementById("name").value,
                        email: document.getElementById("email").value,
                        password: document.getElementById("password").value,
                        role: document.getElementById("role").value
                    })
                });
                const data = await response.json();
                message.textContent = data.message;
                if (response.ok) {
                    setTimeout(() => window.location.href = `/login?role=${document.getElementById("role").value}`, 1000);
                }
            } catch (error) {
                message.textContent = "Unable to connect to the server. Please try again.";
            }
        });
    </script>
</body>
</html>
