<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmotiLearn | Sign In</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="glass-card auth-card">
        <h1>EmotiLearn</h1>
        <h2 id="loginTitle">Welcome back</h2>
        <p id="loginSubtitle">Sign in to continue your learning journey.</p>

        <form id="loginForm">
            <input id="email" type="email" placeholder="Email Address" required>
            <input id="password" type="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>

        <p id="message"></p>
        <p>Don't have an account? <a id="signupLink" href="/signup">Create Account</a></p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const role = params.get("role");
        const allowedRoles = ["student", "teacher", "parent"];

        if (allowedRoles.includes(role)) {
            const displayRole = role.charAt(0).toUpperCase() + role.slice(1);
            document.getElementById("loginTitle").textContent = `${displayRole} Sign In`;
            document.getElementById("loginSubtitle").textContent = `Sign in to access your ${role} portal.`;
            document.getElementById("signupLink").href = `/signup?role=${role}`;
        }

        document.getElementById("loginForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const message = document.getElementById("message");
            message.textContent = "Signing in...";

            try {
                const response = await fetch("/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: document.getElementById("email").value,
                        password: document.getElementById("password").value,
                        role: allowedRoles.includes(role) ? role : null
                    })
                });

                const data = await response.json();
                message.textContent = data.message;

                if (response.ok) {
                    window.location.href = data.redirect;
                }
            } catch (error) {
                message.textContent = "Unable to connect to the server. Please try again.";
            }
        });
    </script>
</body>
</html>
